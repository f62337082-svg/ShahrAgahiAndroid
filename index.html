<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:'Vazirmatn', Tahoma, sans-serif}
:root{
  --bg: #eef2f6; --text: #1e293b; --text-muted: #64748b;
  --glass-bg: rgba(255, 255, 255, 0.7); --glass-border: rgba(255, 255, 255, 0.9);

[data-theme="dark"] {
  --bg: #000000; --text: #f8fafc; --text-muted: #94a3b8;
  --glass-bg: rgba(20, 20, 25, 0.8); --glass-border: rgba(255, 255, 255, 0.08);
  --shadow: 0 10px 30px rgba(0,0,0,0.6);
}
[data-theme="cinematic"] {
  --bg: linear-gradient(135deg, #09090b, #2e1065, #4c1d95); --text: #f8fafc; --text-muted: #cbd5e1;
  --glass-bg: rgba(46, 16, 101, 0.4); --glass-border: rgba(168, 85, 247, 0.3);
  --shadow: 0 10px 30px rgba(0,0,0,0.5);
}
[data-theme="ocean"] {
  --bg: linear-gradient(135deg, #042f2e, #0c4a6e, #0891b2); --text: #f0fdfa; --text-muted: #a5f3fc;

}
[data-theme="sunset"] {
  --bg: linear-gradient(135deg, #1c1917, #7c2d12, #be185d); --text: #fef2f2; --text-muted: #fed7aa;
  --glass-bg: rgba(124, 45, 18, 0.4); --glass-border: rgba(251, 146, 60, 0.4);
  --shadow: 0 10px 30px rgba(0,0,0,0.5);

body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; transition: all 0.4s ease; overflow-x: hidden; }
[data-theme="cinematic"] body, [data-theme="ocean"] body, [data-theme="sunset"] body { background-attachment: fixed; }
.glass { background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); box-shadow: var(--shadow); border-radius: 20px; transition: transform 0.2s, box-shadow 0.2s; }
.glass:active { transform: scale(0.98); }

header { position: sticky; top: 0; z-index: 100; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-radius: 0 0 16px 16px; border-top: none; border-left: none; border-right: none; margin-bottom: 6px; }
header h1 { font-size: 18px; flex: 1; text-align: center; }
.header-btn { background: transparent; border: none; color: var(--text); font-size: 18px; cursor: pointer; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,0.1); }
.header-btn:active { background: rgba(0,0,0,0.1); }
input, textarea, select { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: var(--text); font-size: 13px; font-family: inherit; outline: none; transition: 0.3s; }
input:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: var(--glow); background: rgba(255,255,255,0.1); }
[data-theme="light"] input, [data-theme="light"] textarea, [data-theme="light"] select { background: rgba(0,0,0,0.03); }
label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700; color: var(--text-muted); }
.field { margin-bottom: 10px; position: relative; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.password-wrapper { position: relative; }
.password-wrapper input { padding-left: 36px; }
.eye-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 16px; color: var(--text-muted); z-index: 10; }
.btn { padding: 10px; border-radius: 10px; border: none; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; color: #fff; width: 100%; }

.ad-card { position: relative; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; border-radius: 12px; }

.nav-btn { background: transparent; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 9px; cursor: pointer; transition: 0.3s; font-weight: bold; padding: 4px 8px; border-radius: 10px; }

.search-bar { padding: 6px 12px; margin: 0 12px 8px; display: flex; gap: 8px; align-items: center; border-radius: 12px; }
.chip { padding: 6px 12px; border-radius: 16px; font-size: 11px; cursor: pointer; white-space: nowrap; background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text); transition: 0.2s; }
.chip.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: var(--glow); }
.tab-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.tab { padding: 8px 4px; border-radius: 8px; background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-muted); cursor: pointer; text-align: center; font-weight: bold; font-size: 11px; }
.tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.admin-item { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
.admin-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.admin-actions { display: flex; gap: 4px; flex-wrap: wrap; }
.theme-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
.theme-dot { width: 100%; aspect-ratio: 1; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
.theme-dot:active { transform: scale(0.9); }
.theme-dot.active { border-color: #fff; box-shadow: 0 0 10px var(--primary); }
.switch-container { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--glass-border); }
.switch-container label { margin: 0; font-size: 12px; color: var(--text); }
.switch { position: relative; display: inline-block; width: 40px; height: 22px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
.slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: var(--success); }
input:checked + .slider:before { transform: translateX(18px); }
.toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 10px 20px; border-radius: 30px; font-weight: bold; font-size: 12px; z-index: 9999; transition: 0.4s; box-shadow: var(--shadow); }
.toast.show { top: 20px; }
.toast.error { background: var(--danger); }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; opacity: 0; transition: 0.3s; pointer-events: none; }
.modal-bg.show { opacity: 1; pointer-events: all; }
.modal { width: 100%; max-width: 380px; padding: 16px; max-height: 90vh; overflow-y: auto; transform: scale(0.9); transition: 0.3s; }
.modal-bg.show .modal { transform: scale(1); }
</style>

const COLORS = ['#ef4444','#f97316','#f59e0b','#eab308','#84cc16','#22c55e','#10b981','#14b8a6','#06b6d4','#0ea5e9','#3b82f6','#6366f1','#8b5cf6','#a855f7','#d946ef','#ec4899','#f43f5e','#78716c','#64748b','#71717a','#9f1239','#9a3412','#854d0e','#3f6212','#166534','#115e59','#155e75','#1e40af','#3730a3','#5b21b6','#86198f','#9d174d','#b91c1c','#c2410c','#b45309','#4d7c0f','#15803d','#0f766e','#0e7490','#1d4ed8','#4338ca','#6d28d9','#a21caf','#be185d','#e11d48','#ea580c','#ca8a04','#65a30d','#059669','#0891b2'];

function safeParse(key, fallback) {
  try { const d = JSON.parse(getS(key)); return d ? d : fallback; } catch(e) { return fallback; }
}

let defaultSettings = { 
  pass: CONFIG.PASS, pin: CONFIG.PIN, expiryDays: 7, 
  vipPrice: 50, cardNumber: "6032-1234-5678-9012",
  tgAdmin: "@YourTelegram", rubikaAdmin: "@YourRubika",

};

let db = {
  ads: safeParse('sa_ads', []),
  banners: safeParse('sa_banners', []),

  profile: { ...{ name: "", username: "", phone: "", city: "تهران", coins: 0 }, ...safeParse('sa_profile', {}) }
};

let state = {
  page: 'home', ad: null, editId: null, cat: 'all', search: '', city: 'all',
  adminTab: 'dashboard', authStep: 0, theme: getS('sa_theme') || 'light',
  primaryColor: getS('sa_primary') || '#8b5cf6', lang: getS('sa_lang') || 'fa'
};

// اگر کاربر اسم یا آیدی نداشت → صفحه ثبت‌نام اجباری باز شود
if(!db.profile.name || !db.profile.username) state.page = 'setup';

// ================= توابع پایه =================
function saveDB() { for(let k in db) setS('sa_'+k, JSON.stringify(db[k])); }
function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.documentElement.style.setProperty('--primary', state.primaryColor);
  document.documentElement.style.setProperty('--primary-hover', state.primaryColor);
  document.documentElement.style.setProperty('--glow', `0 0 15px ${state.primaryColor}80`);
}
function themeIcon() {
  const icons = {light:'🌙', dark:'✨', cinematic:'☀️', ocean:'🌊', sunset:'🌅'};
  return icons[state.theme] || '🌙';
}
function toggleTheme() {
  const t = ['light', 'dark', 'cinematic', 'ocean', 'sunset'];
  state.theme = t[(t.indexOf(state.theme)+1)%5];
  setS('sa_theme', state.theme); applyTheme(); render();
}
function toast(msg, err) { const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(err?' error':''); setTimeout(()=>t.className='toast',3000); }
function fmtPrice(n) { return (!n||n==0)?'توافقی':Number(n).toLocaleString('fa-IR')+' تومان'; }
function timeAgo(ts) { if(!ts) return 'جدید'; const d=Math.floor((Date.now()-ts)/1000); if(d<3600)return Math.floor(d/60)+' دقیقه پیش'; if(d<86400)return Math.floor(d/3600)+' ساعت پیش'; return Math.floor(d/86400)+' روز پیش'; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function go(page) { state.page = page; render(); window.scrollTo(0,0); }
function togglePass(id, icon) { const i=document.getElementById(id); if(i.type==='password'){i.type='text';icon.textContent='🙈';}else{i.type='password';icon.textContent='👁️';} }

function runCleanup() {
  let ch = false;
  db.ads.forEach(a => {
    if(a.status==='active' && (Date.now()-a.date)>Number(db.settings.expiryDays)*86400000){a.status='expired';ch=true;}
    if((a.status==='sold'||a.status==='expired'||a.status==='deleted') && a.image){a.image='';ch=true;}
  });
  const b = db.ads.length; db.ads = db.ads.filter(a=>a.status!=='deleted'); if(db.ads.length!==b)ch=true;
  const threeDaysAgo = Date.now() - (3 * 24 * 60 * 60 * 1000);
  const initialInbox = db.inbox.length;
  db.inbox = db.inbox.filter(m => !(m.type === 'coin' && m.date < threeDaysAgo));
  if(db.inbox.length !== initialInbox) ch = true;
  if(ch) saveDB();
}

function compressImage(file, cb) {
  const r = new FileReader();
  r.onload = e => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); const max=500; let w=img.width,h=img.height;
      if(w>max){h*=max/w;w=max;} c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg', 0.5));
    };
    img.src = e.target.result;
  };
  r.readAsDataURL(file);
}
function compressReceipt(file, cb) {
  const r = new FileReader();
  r.onload = e => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); const max=600; let w=img.width,h=img.height;
      if(w>max){h*=max/w;w=max;} c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg', 0.6));
    };
    img.src = e.target.result;
  };
  r.readAsDataURL(file);
}

function refreshList() {
  const c = document.getElementById('listings-container'); if(!c) return;
  let f = db.ads.filter(a => a.status==='active' || a.status==='pending');
  if(state.cat!=='all') f = f.filter(a => a.cat===state.cat);
  if(state.city!=='all') f = f.filter(a => a.city===state.city);
  if(state.search) f = f.filter(a => a.title.includes(state.search));
  f.sort((a,b) => {
    if(a.pinned&&!b.pinned)return -1; if(!a.pinned&&b.pinned)return 1;
    if(a.featured&&!b.featured)return -1; if(!a.featured&&b.featured)return 1;
    if(a.vip&&!b.vip)return -1; if(!a.vip&&b.vip)return 1;
    return b.date - a.date;
  });
  if(f.length===0) { c.innerHTML = `<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:12px">آگهی‌ای یافت نشد 📭</div>`; return; }

          ${a.pinned ? '<div class="badge bg-pinned">📌</div>' : a.featured ? '<div class="badge bg-featured">⭐</div>' : a.vip ? '<div class="badge bg-vip">💎</div>' : ''}
          <div class="heart">${a.saved ? '❤️' : '🤍'}</div>
        </div>
        <div class="ad-info">
          <div class="ad-title">${esc(a.title)}</div>
          <div class="ad-price">${fmtPrice(a.price)}</div>
          <div class="ad-meta"><span>📍 ${esc(a.city)}</span><span>👀 ${a.views||0}</span></div>
        </div>
      </div>`;
  });
  c.innerHTML = html + '</div>';
}

function previewReceipt(input) {
  if (input.files && input.files[0]) {

      img.src = e.target.result; img.style.display = 'block';

  }
}
async function submitCoinRequest(coins, btnElement) {
  const fileInput = document.getElementById('receipt-img');

  if(btnElement) { btnElement.disabled = true; btnElement.textContent = 'در حال ارسال...'; }
  compressReceipt(fileInput.files[0], (imgData) => {
    db.inbox.push({ type: 'coin', text: `درخواست شارژ ${coins} سکه`, coins: coins, receipt: imgData, date: Date.now() });
    saveDB();
    const modal = btnElement.closest('.modal-bg'); if(modal) modal.remove();

// ================= ویرایش پروفایل =================
function renderEditProfile() {
  return `
    ${renderHeader('ویرایش پروفایل', 'profile')}
    <div style="padding:12px">
      <div class="glass" style="padding:16px">
        <div class="field"><label>نام و نام خانوادگی</label><input id="ep-name" value="${esc(db.profile.name)}" placeholder="فرهاد لکزای صبور"></div>
        <div class="field"><label>آیدی (نام کاربری)</label><input id="ep-username" value="${esc(db.profile.username)}" placeholder="farhad_lakzaii"></div>
        <div class="field"><label>شماره تماس</label><input id="ep-phone" type="tel" value="${esc(db.profile.phone)}"></div>
        <button class="btn btn-primary" onclick="saveEditProfile()">💾 ذخیره تغییرات</button>
        <button class="btn btn-danger" style="margin-top:8px" onclick="deleteAccount()">🗑️ حذف حساب کاربری</button>
      </div>
    </div>
    ${renderNav()}
  `;
}
function saveEditProfile() {
  const name = document.getElementById('ep-name').value.trim();
  const username = document.getElementById('ep-username').value.trim();
  if(name.length < 2) return toast('نام را کامل وارد کنید', true);
  if(username.length < 3) return toast('آیدی حداقل ۳ کاراکتر باشد', true);
  db.profile.name = name;
  db.profile.username = username;
  db.profile.phone = document.getElementById('ep-phone').value.trim();
  saveDB();
  toast('تغییرات ذخیره شد ✅');
  go('profile');
}
function deleteAccount() {
  if(!confirm('آیا مطمئنید که می‌خواهید حساب کاربری و تمام اطلاعات خود را حذف کنید؟')) return;
  if(!confirm('⚠️ این عمل قابل بازگشت نیست! مطمئنید؟')) return;
  clearS();
  location.reload();
}

// ================= امنیت و لاگین =================
function renderLogin() {
  let c = '';
  if(state.authStep===1) c = `<h2 class="glow-text" style="margin-bottom:12px;text-align:center;font-size:14px">مرحله ۱</h2><div class="password-wrapper field"><input type="password" id="l-pass" placeholder="رمز"><span class="eye-icon" onclick="togglePass('l-pass',this)">👁️</span></div><button class="btn btn-primary" onclick="checkPass()">بعدی</button>`;
  else if(state.authStep===2) c = `<h2 class="glow-text" style="margin-bottom:12px;text-align:center;font-size:14px">مرحله ۲</h2><div class="password-wrapper field"><input type="password" id="l-pin" placeholder="پین"><span class="eye-icon" onclick="togglePass('l-pin',this)">👁️</span></div><button class="btn btn-primary" onclick="checkPin()">بعدی</button>`;
  else if(state.authStep===3) c = `<h2 class="glow-text" style="margin-bottom:12px;text-align:center;font-size:14px">مرحله ۳</h2><p style="font-size:11px;margin-bottom:8px">${CONFIG.Q1.q}</p>${CONFIG.Q1.opts.map((o,i)=>`<button class="btn btn-secondary" style="margin-bottom:6px;font-size:11px" onclick="checkQ1(${i})">${o}</button>`).join('')}`;
  else if(state.authStep===4) c = `<h2 class="glow-text" style="margin-bottom:12px;text-align:center;font-size:14px">مرحله ۴</h2><p style="font-size:11px;margin-bottom:8px">${CONFIG.Q2.q}</p>${CONFIG.Q2.opts.map((o,i)=>`<button class="btn btn-secondary" style="margin-bottom:6px;font-size:11px" onclick="checkQ2(${i})">${o}</button>`).join('')}`;
  
  return `<header class="glass"><button onclick="go('home')">×</button><h1>ورود مدیر</h1><div style="width:40px"></div></header><div style="padding:16px"><div class="glass" style="padding:16px">${c}</div></div>`;
}
function checkPass() { if(document.getElementById('l-pass').value===db.settings.pass){state.authStep=2;render();}else toast('اشتباه',true); }
function checkPin() { if(document.getElementById('l-pin').value===db.settings.pin){state.authStep=3;render();}else toast('اشتباه',true); }
function checkQ1(i) { if(i===CONFIG.Q1.ans){state.authStep=4;render();}else toast('اشتباه',true); }
function checkQ2(i) { if(i===CONFIG.Q2.ans){state.authStep=5;go('admin');toast('خوش آمدید');}else toast('اشتباه',true); }
